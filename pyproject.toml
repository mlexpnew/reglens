[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "Compliance research agent over SEBI circulars: cited answers, eval-gated releases."
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4.0",
  "requests>=2.31",
  "chromadb>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "reportlab>=4.0"]

[project.scripts]
reglens-ingest = "reglens.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
