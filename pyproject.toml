[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "Compliance research agent over SEBI circulars: cited answers, eval-gated releases."
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4.0",
  "requests>=2.31",
  "chromadb>=0.5",
]

[project.optional-dependencies]
# Hugging Face models for embeddings + reranking (pulls torch; install CPU wheel first)
hf = ["sentence-transformers>=3.0"]
# Agent orchestration + LLM
agents = ["langgraph>=0.2", "google-genai>=1.0"]
# Tests use fakes for models and LLM, so CI stays fast and needs no API key
dev = ["pytest>=8.0", "ruff>=0.5", "reportlab>=4.0", "langgraph>=0.2"]

[project.scripts]
reglens-ingest = "reglens.ingest.cli:main"
reglens-ask = "reglens.ask:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
