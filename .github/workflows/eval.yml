name: Eval

# Manual evaluation run: builds the index, then scores RegLens on the labeled
# question set in data/eval/questions.jsonl for each agent configuration.
on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Comma-separated configs: full, no_checker, no_planner, baseline"
        required: false
        default: "full,no_checker"
      limit:
        description: "Only the first N questions (0 = all)"
        required: false
        default: "0"
      sleep:
        description: "Seconds between questions (helps with free-tier rate limits)"
        required: false
        default: "15"
      llm:
        description: "Provider chain, tried in order (keys come from repo secrets)"
        required: false
        default: "groq:llama-3.3-70b-versatile,gemini:gemini-2.5-flash"
      resume:
        description: "Continue the last run: keep scored questions, run only the rest"
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[hf,agents]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/reglens/config.py') }}
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: sebi-pdfs-${{ hashFiles('data/sources.csv') }}
      - name: Build index
        run: python -m reglens.ingest.cli --download > report.json 2> ingest.log || { cat ingest.log; exit 1; }
      - name: Restore previous results (resume)
        if: ${{ inputs.resume }}
        uses: actions/cache/restore@v4
        with:
          path: eval_results
          key: eval-${{ hashFiles('data/eval/questions.jsonl', 'data/sources.csv') }}-${{ github.run_id }}
          restore-keys: eval-${{ hashFiles('data/eval/questions.jsonl', 'data/sources.csv') }}-
      - name: Evaluate (fails if coverage is below 90%)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REGLENS_LLM: ${{ inputs.llm }}
          CONFIGS: ${{ inputs.configs }}
          LIMIT: ${{ inputs.limit }}
          SLEEP: ${{ inputs.sleep }}
          RESUME: ${{ inputs.resume && '--resume' || '' }}
        run: |
          set +e
          python -m reglens.eval --configs "$CONFIGS" --limit "$LIMIT" --sleep "$SLEEP" \
            --out eval_results $RESUME
          code=$?
          cat eval_results/report.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $code
      - name: Save results for a later resume
        if: always()
        uses: actions/cache/save@v4
        with:
          path: eval_results
          key: eval-${{ hashFiles('data/eval/questions.jsonl', 'data/sources.csv') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval_results/
