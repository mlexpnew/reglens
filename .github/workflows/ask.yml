name: Ask

# Manual demo: build the index, then answer questions with the agent graph.
# Leave "question" empty to run the built-in demo set, which includes one
# off-topic question to prove the refusal path.
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Your SEBI question (empty = run demo set)"
        required: false
        default: ""

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[hf,agents]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/reglens/config.py') }}
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: sebi-pdfs-${{ hashFiles('data/sources.csv') }}
      - name: Build index
        run: python -m reglens.ingest.cli --download > report.json 2> ingest.log || { cat ingest.log; exit 1; }
      - name: Ask
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUESTION: ${{ inputs.question }}
        run: |
          if [ -n "$QUESTION" ]; then
            printf '%s\n' "$QUESTION" > questions.txt
          else
            cat > questions.txt <<'EOF'
          What is the Credit Risk-o-Meter and which securities does it apply to?
          What are the revised position limits for clients in commodity derivatives?
          What must stock brokers display on their trading apps under Project Jagrook?
          Who won the 2011 Cricket World Cup?
          EOF
          fi
          echo "## RegLens answers" >> "$GITHUB_STEP_SUMMARY"
          i=0; failed=0
          while IFS= read -r q; do
            q="$(echo "$q" | sed 's/^ *//')"; [ -z "$q" ] && continue
            i=$((i+1))
            if ! python -m reglens.ask --json "$q" > "answer_$i.json" 2> "err_$i.log"; then
              failed=$((failed+1))
              # surface the cause on the run page (and via the checks API), not only in logs
              echo "::error title=Q$i failed::$(grep -vE '^\s*$' "err_$i.log" | tail -3 | tr '\n' ' ' | cut -c1-600)"
              { echo; echo "### Q$i. $q"; echo; echo "> ⚠️ failed: $(tail -1 "err_$i.log")"; } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            python - "$i" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          a = json.load(open(f"answer_{sys.argv[1]}.json"))
          print(f"\n### Q{sys.argv[1]}. {a['question']}\n")
          print(a["text"] + "\n")
          for lbl, cite in a["citations"].items():
              print(f"- **[{lbl}]** [{cite}]({a['urls'][lbl]})")
          rel = ", ".join(f"{p['relevance']:.2f}" for p in a["top_passages"]) or "none"
          print(f"\n<sub>refused={a['refused']} · latency={a['latency_s']}s · "
                f"rerank relevance: {rel}{' · ' + a['reason'] if a['reason'] else ''}</sub>")
          PY
            # also publish each answer as a run annotation: readable on the run page
            # and through the checks API without opening logs or downloading artifacts
            python - "$i" <<'PY'
          import json, sys
          a = json.load(open(f"answer_{sys.argv[1]}.json"))
          lines = [a["text"], ""] + [f"[{k}] {v}" for k, v in a["citations"].items()]
          rel = ", ".join(f"{p['relevance']:.2f}" for p in a["top_passages"]) or "none"
          lines.append(f"refused={a['refused']} latency={a['latency_s']}s relevance={rel} {a['reason']}")
          msg = "\n".join(lines).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          title = f"Q{sys.argv[1]} {a['question']}"[:120].replace(":", " -").replace(",", " ")
          print(f"::notice title={title}::{msg}")
          PY
          done < questions.txt
          echo "answered $((i-failed))/$i"
          [ "$failed" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answers
          path: answer_*.json
